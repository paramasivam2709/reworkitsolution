<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stackly IT Solutions</title>
  <meta name="description" content="Login to your Stackly account to access your dashboard and manage your services.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23a3e635' rx='15' width='100' height='100'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50' font-weight='bold' fill='%230a0e27'>S</text></svg>">
</head>
<body>
  <div class="page-loader">
    <div class="loader"></div>
  </div>
  
  <!-- Auth Page -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <a href="../index.html" class="logo">
      <img src="../images/logo_green.webp" alt="Stackly Logo" class="logo-img">
      <span class="logo-text">Stackly</span>
      </a>
          <p>Welcome back! Please login to your account.</p>
        </div>
        
        <h2>Login to Your Account</h2>
        
        <!-- Role Selector -->
        <div class="role-selector">
          <div class="role-option">
            <input type="radio" name="role" id="userRole" value="user" checked>
            <label for="userRole" class="role-label">
              <i class="fas fa-user"></i>
              <span>User</span>
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="adminRole" value="admin">
            <label for="adminRole" class="role-label">
              <i class="fas fa-user-shield"></i>
              <span>Admin</span>
            </label>
          </div>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>
          
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="404.html" class="forgot-password">Forgot Password?</a>
          </div>
          
          <button type="submit" class="btn btn-primary auth-btn">
            Login <i class="fas fa-sign-in-alt"></i>
          </button>
        </form>
        
        <!-- Divider -->
        <div class="auth-divider">
          <span>Or login with</span>
        </div>
        
        <!-- Social Login -->
        <div class="social-login">
          <button class="social-btn" onclick="showToast('Google login coming soon!', 'info')">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </button>
          <button class="social-btn" onclick="showToast('LinkedIn login coming soon!', 'info')">
            <i class="fab fa-linkedin-in"></i>
            <span>LinkedIn</span>
          </button>
        </div>
        
        <!-- Auth Footer -->
        <div class="auth-footer">
          <p>Don't have an account? <a href="register.html">Register Now</a></p>
        </div>
        
        <!-- Back to Home -->
        <div style="text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid var(--border-color);">
          <a href="../index.html" style="color: var(--text-secondary); font-size: 0.9rem;">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../js/main.js"></script>
  <script>
    // Login form handling
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (validateForm(this)) {
        const role = document.querySelector('input[name="role"]:checked').value;
        const email = document.getElementById('email').value;
        
        // Simulate login - in real app, this would be an API call
        showToast('Login successful! Redirecting...', 'success');
        
        setTimeout(() => {
          if (role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 1500);
      }
    });
  </script>
</body>
</html>
