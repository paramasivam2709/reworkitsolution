<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Stackly IT Solutions</title>
  <meta name="description" content="Create your Stackly account to access our IT solutions and services.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23a3e635' rx='15' width='100' height='100'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50' font-weight='bold' fill='%230a0e27'>S</text></svg>">
</head>
<body>
  <div class="page-loader">
    <div class="loader"></div>
  </div>
  
  <!-- Auth Page -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <a href="../index.html" class="logo">
      <img src="../images/logo_green.webp" alt="Stackly Logo" class="logo-img">
      <span class="logo-text">Stackly</span>
      </a>
          <p>Create an account to get started with Stackly.</p>
        </div>
        
        <h2>Create Your Account</h2>
        
        <!-- Register Form -->
        <form id="registerForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
            </div>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
          </div>
          
          <div class="form-group">
            <label for="company">Company Name (Optional)</label>
            <input type="text" id="company" name="company" placeholder="Your Company">
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
          </div>
          
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
          </div>
          
          <div class="form-group">
            <label class="remember-me" style="cursor: pointer;">
              <input type="checkbox" name="terms" required>
              <span>I agree to the <a href="#" style="color: var(--accent-color);">Terms of Service</a> and <a href="#" style="color: var(--accent-color);">Privacy Policy</a></span>
            </label>
          </div>
          
          <button type="submit" class="btn btn-primary auth-btn">
            Create Account <i class="fas fa-user-plus"></i>
          </button>
        </form>
        
        <!-- Divider -->
        <div class="auth-divider">
          <span>Or register with</span>
        </div>
        
        <!-- Social Login -->
        <div class="social-login">
          <button class="social-btn" onclick="showToast('Google registration coming soon!', 'info')">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </button>
          <button class="social-btn" onclick="showToast('LinkedIn registration coming soon!', 'info')">
            <i class="fab fa-linkedin-in"></i>
            <span>LinkedIn</span>
          </button>
        </div>
        
        <!-- Auth Footer -->
        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Login Now</a></p>
        </div>
        
        <!-- Back to Home -->
        <div style="text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid var(--border-color);">
          <a href="../index.html" style="color: var(--text-secondary); font-size: 0.9rem;">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../js/main.js"></script>
  <script>
    // Register form handling
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        showToast('Passwords do not match!', 'error');
        document.getElementById('confirmPassword').classList.add('form-error');
        return;
      }
      
      if (password.length < 8) {
        showToast('Password must be at least 8 characters long!', 'error');
        return;
      }
      
      if (validateForm(this)) {
        // Simulate registration - in real app, this would be an API call
        showToast('Account created successfully! Redirecting...', 'success');
        
        setTimeout(() => {
          window.location.href = 'user-dashboard.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
